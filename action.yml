name: 'ooshare-action'
description: 'Create and reveal one-time secrets with the ooshare CLI, right in your workflow'
author: 'dhdtech'
branding:
  icon: 'lock'
  color: 'green'

inputs:
  command:
    description: 'Operation to run: create (new one-time secret) or view (reveal a secret)'
    required: true
  text:
    description: 'Secret text to share (create). Reference a GitHub secret, e.g. secrets.MY_SECRET'
    required: false
    default: ''
  file:
    description: 'Path to a file to attach (create), relative to the workspace'
    required: false
    default: ''
  ttl:
    description: 'Expiry in hours (1-72)'
    required: false
    default: '24'
  lang:
    description: 'Viewer language for the share link (en, zh, es, hi, ar, pt)'
    required: false
    default: 'en'
  url:
    description: 'Share URL to reveal (view)'
    required: false
    default: ''
  output:
    description: 'Where to write a decoded file attachment (view): a directory or exact path. (Use the attachment output to read the file bytes in later steps.)'
    required: false
    default: ''
  version:
    description: 'ooshare CLI release version (e.g. v1.0.3)'
    required: false
    default: 'v1.0.3'
  api-url:
    description: 'ooshare API base URL'
    required: false
    default: 'https://api.ooshare.io'
  origin:
    description: 'Site origin used to build the share URL'
    required: false
    default: 'https://ooshare.io'

outputs:
  url:
    description: 'The one-time share URL (create). Contains the decryption key — treat it as sensitive.'
    value: ${{ steps.run.outputs.url }}
  id:
    description: 'The secret ID (create)'
    value: ${{ steps.run.outputs.id }}
  has_attachment:
    description: 'true when a file was attached (create)'
    value: ${{ steps.run.outputs.has_attachment }}
  text:
    description: 'The revealed secret text (view)'
    value: ${{ steps.run.outputs.text }}
  attachment:
    description: 'Path where a decoded file attachment was written (view)'
    value: ${{ steps.run.outputs.attachment }}
  attachment-mime:
    description: 'MIME type of a decoded file attachment (view)'
    value: ${{ steps.run.outputs.attachment-mime }}

runs:
  using: 'composite'
  steps:
    - name: Download ooshare binary
      shell: bash
      run: |
        set -euo pipefail
        VER="${{ inputs.version }}"; VER="${VER#v}"
        case "${{ runner.os }}" in
          Linux)  OS=linux ;;
          macOS)  OS=darwin ;;
          Windows) OS=windows ;;
          *) echo "::error::unsupported runner.os ${{ runner.os }}"; exit 1 ;;
        esac
        case "${{ runner.arch }}" in
          X64)   ARCH=amd64 ;;
          ARM64) ARCH=arm64 ;;
          *) echo "::error::unsupported runner.arch ${{ runner.arch }}"; exit 1 ;;
        esac
        EXT=tar.gz; [ "$OS" = "windows" ] && EXT=zip
        ASSET="ooshare_${VER}_${OS}_${ARCH}.${EXT}"
        BASE="https://github.com/dhdtech/ooshare.io/releases/download/v${VER}"
        echo "Downloading ${ASSET}"
        curl -fsSL "$BASE/${ASSET}" -o "/tmp/${ASSET}"
        # Integrity gate: fail unless the archive matches the published SHA256SUMS.
        # Every release is also cosign-signed with SLSA provenance (see the repo).
        curl -fsSL "$BASE/SHA256SUMS" -o /tmp/ooshare.SHA256SUMS
        sed 's/\r$//' /tmp/ooshare.SHA256SUMS | grep " ${ASSET}$" > /tmp/ooshare.check
        if command -v sha256sum >/dev/null 2>&1; then
          (cd /tmp && sha256sum -c ooshare.check)
        else
          (cd /tmp && shasum -a 256 -c ooshare.check)
        fi
        mkdir -p /tmp/ooshare-bin
        if [ "$EXT" = "zip" ]; then
          (cd /tmp/ooshare-bin && unzip -o "/tmp/${ASSET}" ooshare.exe)
        else
          tar -xzf "/tmp/${ASSET}" -C /tmp/ooshare-bin ooshare
        fi
        chmod +x /tmp/ooshare-bin/ooshare*
        rm -f "/tmp/${ASSET}" /tmp/ooshare.SHA256SUMS /tmp/ooshare.check

    - name: Run ooshare
      id: run
      shell: bash
      env:
        OOSHARE_TEXT: ${{ inputs.text }}
        OOSHARE_URL: ${{ inputs.url }}
        OOSHARE_FILE: ${{ inputs.file }}
        OOSHARE_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        BIN=/tmp/ooshare-bin/ooshare
        [ "${{ runner.os }}" = "Windows" ] && BIN=/tmp/ooshare-bin/ooshare.exe

        case "${{ inputs.command }}" in
          create)
            args=(create --json --ttl "${{ inputs.ttl }}" --lang "${{ inputs.lang }}" \
              --api-url "${{ inputs.api-url }}" --origin "${{ inputs.origin }}")
            [ -n "$OOSHARE_FILE" ] && args+=(--file "$OOSHARE_FILE")
            out="$(printf '%s' "$OOSHARE_TEXT" | "$BIN" "${args[@]}")"
            echo "url=$(printf '%s' "$out" | jq -r .url)" >> "$GITHUB_OUTPUT"
            echo "id=$(printf '%s' "$out" | jq -r .id)" >> "$GITHUB_OUTPUT"
            echo "has_attachment=$(printf '%s' "$out" | jq -r .has_attachment)" >> "$GITHUB_OUTPUT"
            ;;
          view)
            if [ -n "$OOSHARE_OUTPUT" ]; then
              out="$("$BIN" view --json --api-url "${{ inputs.api-url }}" --output "$OOSHARE_OUTPUT" "$OOSHARE_URL")"
            else
              out="$("$BIN" view --json --api-url "${{ inputs.api-url }}" "$OOSHARE_URL")"
            fi
            echo "text=$(printf '%s' "$out" | jq -r '.text // empty')" >> "$GITHUB_OUTPUT"
            if [ "$(printf '%s' "$out" | jq -r 'has("attachment")')" = "true" ]; then
              echo "attachment=$(printf '%s' "$out" | jq -r .attachment.path)" >> "$GITHUB_OUTPUT"
              echo "attachment-mime=$(printf '%s' "$out" | jq -r .attachment.mime)" >> "$GITHUB_OUTPUT"
            fi
            ;;
          *)
            echo "::error::command must be 'create' or 'view', got '${{ inputs.command }}'"
            exit 1
            ;;
        esac
